<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戒指音箱联动测试</title>
<style>
body{font:18px/1.65 system-ui,sans-serif;max-width:720px;margin:8vh auto;padding:0 24px;color:#163047;background:#f2f7fa}
button{font:inherit;background:#135b72;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
#status{padding:18px;border:1px solid #b6cdd9;border-radius:8px;background:white}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.metrics div{background:white;border:1px solid #b6cdd9;border-radius:8px;padding:12px}.metrics dd{margin:4px 0;font-weight:650}button:disabled{opacity:.55;cursor:default}
#scene-photo{display:block;max-width:100%;max-height:320px;border-radius:8px}#scene-photo[hidden]{display:none}
</style>
<p><a href="/">返回 Connect Studio</a></p>
<h1>戒指音箱联动测试</h1>
<p>点一次「开始测试」，确认听到短提示音。测试时保持这个页面在前台。</p>
<button id="start">开始测试</button>
<p>双击戒指触摸区，拍摄并播报音箱看到的画面。4 秒内做两次向下动作，播报「我摔倒了」。</p>
<p><button id="describe">描述当前画面</button></p>
<p id="status" role="status" aria-live="polite">等待开始</p>
<section id="scene" aria-labelledby="scene-heading" hidden>
<h2 id="scene-heading">画面描述</h2>
<p id="scene-description"></p>
<img id="scene-photo" alt="音箱拍摄的画面" hidden>
</section>
<section aria-labelledby="health-heading">
<h2 id="health-heading">戒指生理指标</h2>
<dl class="metrics">
  <div><dt>心率</dt><dd id="heart-rate">—</dd></div>
  <div><dt>血氧</dt><dd id="oxygen">—</dd></div>
  <div><dt>戒指测得温度</dt><dd id="ring-temperature">—</dd></div>
</dl>
<p><button id="connect-ring">连接戒指蓝牙数据</button> <button id="reconnect-ring">重连已授权戒指</button> <button id="scan-all">显示全部附近设备</button> <button id="measure-ring" disabled>开始测量</button></p>
<p><button id="measure-windows" hidden>使用 Windows 已配对的戒指测量</button></p>
<p id="health-status" role="status">请戴好戒指，测量时保持手部静止。</p>
</section>
<script>
const status = document.getElementById('status');
const start = document.getElementById('start');
const motions = [];
let audio;
let nextAlarm = 0;
function beep(offset, duration) {
  const tone = audio.createOscillator();
  const volume = audio.createGain();
  tone.frequency.value = 660;
  volume.gain.value = 0.12;
  tone.connect(volume).connect(audio.destination);
  tone.start(audio.currentTime + offset);
  tone.stop(audio.currentTime + offset + duration);
}
start.addEventListener('click', async () => {
  try {
    audio ??= new AudioContext();
    await audio.resume();
    beep(0, 0.13);
    status.textContent = '已开始，等待戒指输入';
    start.blur();
  } catch {
    status.textContent = '无法启用音频，请重新点开始测试。';
  }
});
const describeButton = document.getElementById('describe');
const scene = document.getElementById('scene');
const sceneDescription = document.getElementById('scene-description');
const scenePhoto = document.getElementById('scene-photo');
const isStudioPage = location.protocol === 'http:' &&
  location.pathname.replace(/\/$/, '') === '/ring-integration';
const scenePlayer = new Audio();
let sceneRequest;
let serverSpeechUntil = 0;

async function postJson(path, payload, signal) {
  const response = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
    signal,
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || '本机服务请求失败。');
  return result;
}

function mediaUrl(value) {
  if (typeof value !== 'string' || !value.startsWith('/api/media/')) return '';
  const url = new URL(value, location.origin);
  return url.pathname.startsWith('/api/media/') ? url.href : '';
}

function speak(message) {
  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = 'zh-CN';
  speech.onerror = event => {
    if (event.error !== 'canceled' && event.error !== 'interrupted') {
      status.textContent = '浏览器未能播放语音。';
    }
  };
  speechSynthesis.speak(speech);
}

async function reportScene() {
  if (sceneRequest || performance.now() < nextAlarm) return;
  if (!isStudioPage) {
    status.textContent = '请运行 frontend/start.cmd，从 Connect Studio 打开戒指联动。';
    return;
  }
  speechSynthesis.cancel();
  scenePlayer.pause();
  const request = new AbortController();
  sceneRequest = request;
  const timeout = setTimeout(() => request.abort('timeout'), 100000);
  describeButton.disabled = true;
  status.textContent = '正在获取音箱画面，等待模型回答…';
  try {
    const result = await postJson('/api/describe', {text: '描述一下你看到的画面'}, request.signal);
    if (request.signal.aborted) return;
    if (typeof result.answer !== 'string' || !result.answer.trim()) {
      throw new Error('模型没有返回画面描述。');
    }
    sceneDescription.textContent = result.answer;
    const photo = mediaUrl(result.image_url);
    scenePhoto.hidden = !photo;
    if (photo) scenePhoto.src = photo;
    else scenePhoto.removeAttribute('src');
    scene.hidden = false;
    if (result.audio_deferred === true) {
      status.textContent = '画面描述已生成。安全播报优先，本次仅显示文字。';
      return;
    }
    status.textContent = '画面描述已生成。';
    if (result.played === true) {
      serverSpeechUntil = performance.now() + (Number(result.audio_duration_ms) || 0);
      return;
    }
    const wav = mediaUrl(result.audio_url);
    if (wav) {
      scenePlayer.src = wav;
      try {
        await scenePlayer.play();
        return;
      } catch {
        if (request.signal.aborted) return;
      }
    }
    speak(result.answer);
  } catch (error) {
    if (request.signal.reason === 'timeout') {
      status.textContent = '画面描述请求超时，请稍后重试。';
    } else if (!request.signal.aborted) {
      status.textContent = '画面描述失败 · ' + error.message;
    }
  } finally {
    clearTimeout(timeout);
    sceneRequest = undefined;
    describeButton.disabled = false;
  }
}

async function reportFall() {
  const stopServerSpeech = sceneRequest || performance.now() < serverSpeechUntil;
  sceneRequest?.abort('alarm');
  scenePlayer.pause();
  speechSynthesis.cancel();
  if (stopServerSpeech && isStudioPage) {
    try {
      await postJson('/api/playback/stop', {}, AbortSignal.timeout(1000));
    } catch {
      // Keep the gesture's local speech available if the service cannot be reached.
    }
  }
  speak('我摔倒了');
  status.textContent = '已触发求救语音';
}

describeButton.addEventListener('click', () => {
  describeButton.blur();
  void reportScene();
});
window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.isComposing || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, button, a, [contenteditable]')) return;
  if (audio?.state !== 'running' || !['PageUp', 'PageDown', 'Enter'].includes(event.key)) return;
  event.preventDefault();
  if (event.repeat) return;
  if (event.key === 'Enter') {
    motions.length = 0;
    void reportScene();
    return;
  }
  if (event.key === 'PageUp') return;
  const now = performance.now();
  if (now < nextAlarm) return;
  while (motions.length && now - motions[0] > 4000) motions.shift();
  motions.push(now);
  status.textContent = '收到向下动作（Page Down），计数 ' + motions.length + ' / 2';
  if (motions.length === 2) {
    motions.length = 0;
    nextAlarm = now + 2500;
    void reportFall();
  }
});
const connectRing = document.getElementById('connect-ring');
const measureRing = document.getElementById('measure-ring');
const measureWindows = document.getElementById('measure-windows');
measureWindows.hidden = !isStudioPage;
const healthStatus = document.getElementById('health-status');
const metrics = ['heart-rate', 'oxygen', 'ring-temperature'].map(id => document.getElementById(id));
const ringUuid = part => 'bae8' + part + '-4f05-4503-8e65-3af1f7329d1f';
let ringDevice;
let ringCommand;
let measurement;
let measuringWithWindows = false;
let ringSequence = 0;

function finishMeasurement(message) {
  clearTimeout(measurement?.timer);
  measurement = undefined;
  measureRing.disabled = !ringCommand || measuringWithWindows;
  measureWindows.disabled = measuringWithWindows;
  healthStatus.textContent = message;
}

function receiveHealth(event) {
  const packet = event.target.value;
  if (!measurement || packet.byteLength < 5 || packet.getUint8(0) !== 0 ||
      packet.getUint8(1) !== measurement.sequence || packet.getUint8(2) !== 0x32) return;
  const subtype = packet.getUint8(3);
  const state = packet.getUint8(4);
  if (subtype === 0xff) {
    measurement.progress = state;
    healthStatus.textContent = '测量中 · ' + state + '%';
    return;
  }
  if (subtype !== 0 || packet.byteLength < 9) return;
  if (state === 0 || state === 2 || state === 4) {
    finishMeasurement({0:'戒指未检测到佩戴，请调整位置后重试。', 2:'请将戒指取下充电座再测量。', 4:'戒指正在进行其他测量，请稍后重试。'}[state]);
    return;
  }
  if (state !== 3) return;
  const heart = packet.getUint8(5);
  const oxygen = packet.getUint8(6);
  const temperature = packet.getInt16(7, true);
  metrics[0].textContent = heart > 0 && heart < 255 ? heart + ' 次/分' : '—';
  metrics[1].textContent = oxygen > 0 && oxygen <= 100 ? oxygen + '%' : '—';
  metrics[2].textContent = temperature > 0 && temperature < 10000
    ? (temperature / 100).toFixed(2) + ' °C' : '—';
  if (measurement.progress >= 100) {
    finishMeasurement(metrics.some(metric => metric.textContent === '—')
      ? '测量结束，部分指标未收到有效读数。' : '测量完成。');
  }
}

const scanAll = document.getElementById('scan-all');
const reconnectRing = document.getElementById('reconnect-ring');
connectRing.addEventListener('click', () => connectHealth(false));
scanAll.addEventListener('click', () => connectHealth(true));

reconnectRing.addEventListener('click', () => connectHealth(false, true));

async function connectHealth(showAll, previouslyAuthorized = false) {
  if (!navigator.bluetooth?.requestDevice) {
    healthStatus.textContent = '当前浏览器无法访问蓝牙，请用 Windows 上的 Edge 或 Chrome 打开本页。';
    return;
  }
  if (ringCommand) {
    ringDevice.gatt.disconnect();
    return;
  }
  connectRing.disabled = true;
  scanAll.disabled = true;
  reconnectRing.disabled = true;
  try {
    const options = showAll ? {acceptAllDevices: true, optionalServices: [ringUuid('0001')]} : {
      filters: [
        {namePrefix: 'BCL603'},
        {manufacturerData: [{companyIdentifier: 0xff14}]}
      ],
      optionalServices: [ringUuid('0001')]
    };
    let device;
    if (previouslyAuthorized) {
      device = ringDevice;
      if (!device && navigator.bluetooth.getDevices) {
        const knownDevices = await navigator.bluetooth.getDevices();
        device = knownDevices.find(item => item.name === 'BCL6039F5A');
      }
      if (!device) throw new Error('此页面没有可重连的戒指授权。请使用之前成功测量的 Edge 标签页和浏览器个人资料。');
    } else {
      device = await navigator.bluetooth.requestDevice(options);
    }
    if (showAll && device.name !== 'BCL6039F5A') throw new Error('请选择 BCL6039F5A');
    ringDevice = device;
    const onDisconnect = () => {
      ringCommand = undefined;
      scanAll.disabled = false;
      reconnectRing.disabled = false;
      connectRing.textContent = '连接戒指蓝牙数据';
      const hasPreviousValue = metrics.some(metric => metric.textContent !== '—');
      finishMeasurement(hasPreviousValue
        ? '戒指蓝牙数据已断开。上方显示上次收到的读数。'
        : '戒指蓝牙数据已断开。');
    };
    device.addEventListener('gattserverdisconnected', onDisconnect, {once:true});
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(ringUuid('0001'));
    const command = await service.getCharacteristic(ringUuid('0010'));
    const notify = await service.getCharacteristic(ringUuid('0011'));
    notify.addEventListener('characteristicvaluechanged', receiveHealth);
    await notify.startNotifications();
    if (!server.connected) throw new Error('戒指已断开');
    ringCommand = command;
    connectRing.textContent = '断开蓝牙数据';
    measureRing.disabled = measuringWithWindows;
    healthStatus.textContent = device.name + ' 已连接，可以开始测量。';
  } catch (error) {
    if (ringDevice?.gatt.connected) ringDevice.gatt.disconnect();
    healthStatus.textContent = error.name === 'NotFoundError'
      ? '未选择戒指。请先断开平板上的 nRF Connect，再重新选择。'
      : '蓝牙连接失败 · ' + error.message;
  } finally {
    connectRing.disabled = false;
    scanAll.disabled = Boolean(ringCommand);
    reconnectRing.disabled = Boolean(ringCommand);
  }
}

measureRing.addEventListener('click', async () => {
  if (!ringCommand || measurement || measuringWithWindows) return;
  measureRing.disabled = true;
  measureWindows.disabled = true;
  metrics.forEach(metric => { metric.textContent = '—'; });
  const sequence = ringSequence = ringSequence % 255 + 1;
  const request = {
    sequence, progress: 0,
    timer: setTimeout(() => finishMeasurement('测量已超时，请检查佩戴和蓝牙连接。'), 45000)
  };
  measurement = request;
  healthStatus.textContent = '正在测量，请保持手部静止，约需 30 秒。';
  try {
    await ringCommand.writeValueWithResponse(Uint8Array.of(0, sequence, 0x32, 0, 30, 0, 0, 1));
  } catch (error) {
    if (measurement === request) finishMeasurement('测量命令发送失败 · ' + error.message);
  }
});
measureWindows.addEventListener('click', async () => {
  if (!isStudioPage || measurement || measuringWithWindows) return;
  measuringWithWindows = true;
  measureRing.disabled = true;
  measureWindows.disabled = true;
  metrics.forEach(metric => { metric.textContent = '—'; });
  healthStatus.textContent = '正在从 Windows 读取戒指，请保持手部静止。';
  try {
    const {heart, oxygen, temperature} = await postJson('/api/ring/measure', {});
    metrics[0].textContent = heart == null ? '—' : heart + ' 次/分';
    metrics[1].textContent = oxygen == null ? '—' : oxygen + '%';
    metrics[2].textContent = Number.isFinite(temperature) ? temperature.toFixed(2) + ' °C' : '—';
    healthStatus.textContent = metrics.some(metric => metric.textContent === '—')
      ? '测量结束，部分指标未收到有效读数。' : '测量完成。';
  } catch (error) {
    healthStatus.textContent = 'Windows 测量失败 · ' + error.message;
  } finally {
    measuringWithWindows = false;
    measureRing.disabled = !ringCommand;
    measureWindows.disabled = false;
  }
});
</script>
</html>
